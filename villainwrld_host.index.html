<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020804">
<title>VILLAINWRLD // HOST TERMINAL</title>
<style>
:root{--green:#00ff68;--mint:#baffd2;--dim:#70b88a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#020503;color:var(--mint)}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:28px 16px}
.matrix{position:fixed;inset:0;z-index:0;display:grid;grid-template-columns:repeat(25,1fr);gap:5px;overflow:hidden;opacity:.7;pointer-events:none;mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 90%,transparent 100%)}
.matrix span{font-family:monospace;font-size:clamp(13px,2.2vw,22px);font-weight:bold;line-height:1.25;color:#075b20;text-shadow:0 0 7px #00ff44;writing-mode:vertical-rl;animation:fall var(--speed) linear infinite;animation-delay:var(--delay);white-space:pre}
.matrix span:nth-child(4n){color:#00a832}
.matrix span:nth-child(7n){color:#20ff55}
@keyframes fall{from{transform:translateY(-40%)}to{transform:translateY(40%)}}
main{position:relative;z-index:1;width:min(100%,760px);border:1px solid #00e85b9c;border-radius:5px;background:rgba(1,12,6,.91);box-shadow:0 0 35px #00ff662b, inset 0 0 35px #00ff6608}
.top{padding:21px 28px;border-bottom:1px solid #00a84466;color:#65ffa0;font:15px monospace;letter-spacing:3px}
.hero{text-align:center;padding:44px 22px 38px}
.emblem{width:170px;height:170px;margin:0 auto 30px;border:1px solid #00ff6670;background:radial-gradient(circle at 50% 45%,#0b4d29,#03160c 68%);box-shadow:0 0 35px #00ff6633;display:grid;place-items:center;color:#d8ffe5;font-weight:900;font-size:38px;letter-spacing:-3px;text-shadow:0 0 16px #00ff88;transform:rotate(-2deg)}
.emblem small{display:block;font-size:12px;letter-spacing:4px;color:#59e88b;margin-top:5px}
h1{font:900 clamp(29px,7vw,48px)/1.1 monospace;letter-spacing:2px;margin:0 0 18px;color:#d9ffe5;text-shadow:0 0 16px #00ff6680}
.subtitle{font:clamp(14px,3.6vw,20px) monospace;letter-spacing:1px;color:#91cba5;margin:0}
.bottom{border-top:1px solid #00a84466;padding:30px 28px 36px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.status{font:16px monospace;color:#65ffa0;letter-spacing:1px}
button{min-width:250px;padding:22px 28px;border:1px solid #00ff68;border-radius:3px;background:rgba(0,15,7,.92);color:#00ff82;font:800 25px monospace;letter-spacing:2px;cursor:pointer;box-shadow:0 0 20px #00ff6620;transition:.15s}
button:active{background:#00d957;color:#001b09;transform:scale(.98)}
#notice{position:fixed;z-index:5;top:20px;right:18px;width:min(350px,calc(100vw - 36px));padding:17px 19px;background:#20262b;color:#fff;border-left:4px solid #00e85b;border-radius:4px;box-shadow:0 10px 35px #000c;display:none;animation:pop .2s ease-out}
#notice .label{font-size:12px;color:#c6d0ca}
#notice strong{display:block;font-size:16px;margin:9px 0 4px}
#notice .sub{font-size:12px;color:#a9b5ad}
@keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.top{padding:19px 20px}.hero{padding:44px 15px 40px}.emblem{width:145px;height:145px}.bottom{justify-content:center;text-align:center;padding:25px 18px 35px}button{width:100%;min-width:0;font-size:22px}.status{width:100%}}
</style>
</head>
<body>
<div class="matrix" id="matrix" aria-hidden="true"></div>
<main>
  <div class="top">VILLAINWRLD // HOST TERMINAL</div>
  <section class="hero">
    <div class="emblem">V<span style="color:#00ff68">W</span><small>HOST</small></div>
    <h1>VILLAINWRLD HOST</h1>
    <p class="subtitle">PS4 Kernel Exploit · 14.00 / 14.02</p>
  </section>
  <section class="bottom">
    <div class="status">[ SYSTEM READY ]</div>
    <button id="start">START NOW</button>
  </section>
</main>
<div id="notice" role="status" aria-live="polite">
  <div class="label">◈ &nbsp; PlayStation Notification</div>
  <strong>Jailbroken by VILLAIN</strong>
  <div class="sub">VILLAINWRLD</div>
</div>
<script>
const chars='アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const matrix=document.getElementById('matrix');
for(let i=0;i<25;i++){
  const col=document.createElement('span');
  let s='';
  for(let j=0;j<42;j++)s+=chars[Math.floor(Math.random()*chars.length)]+' ';
  col.textContent=s;
  col.style.setProperty('--speed',(9+Math.random()*15)+'s');
  col.style.setProperty('--delay',(-Math.random()*18)+'s');
  matrix.appendChild(col);
}
let timer;
document.getElementById('start').addEventListener('click',()=>{
  const n=document.getElementById('notice');
  n.style.display='block';
  clearTimeout(timer);
  timer=setTimeout(()=>n.style.display='none',5000);
});
</script>
</body>
</html>
